[package]
name = "fx"
version = "0.1.0"
edition = "2021"
publish = false

# 이펙트 코어 (`EFFECTS_PLAN.md`). dsp/ 와 같은 원칙 — wasm-bindgen 없이 숫자 ABI.
# 보이스 엔진과 따로 둔 이유: 이펙트 노드마다 인스턴스를 만들므로 작고 가벼워야 한다.
[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
