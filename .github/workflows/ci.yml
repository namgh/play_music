# CI — `CLAUDE.md` 의 "절대 타협 불가" 항목을 지키는 장치.
#
# 핵심은 **음정 오차 ±1센트 자동 회귀 테스트**다 (`sound.md` 11-1).
# 웨이브가이드의 딜레이를 정수로 반올림하면 고음에서 반음의 3분의 2가 틀어지고,
# 그러면 "음정이 정밀하다"는 제품 주장 전체가 무너진다. 사람이 기억해서 돌리는
# 것으로는 안 되므로 매 푸시마다 자동으로 돈다.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # 같은 브랜치에 연달아 푸시하면 이전 실행을 취소한다
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Rust 설치 (wasm 타겟 포함)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown
          rustup component add rustfmt clippy

      - name: Rust 빌드 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dsp/target
          key: cargo-${{ runner.os }}-${{ hashFiles('dsp/Cargo.toml', 'dsp/src/**') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: npm ci

      # --- Rust 코어 ---------------------------------------------------------

      - name: Rust 포맷 검사
        run: cargo fmt --manifest-path dsp/Cargo.toml --check

      - name: Rust 린트
        run: cargo clippy --manifest-path dsp/Cargo.toml --all-targets -- -D warnings

      - name: Rust 단위 테스트 (필터 수식)
        run: cargo test --manifest-path dsp/Cargo.toml

      - name: Rust → wasm 빌드
        run: npm run build:dsp

      # --- TypeScript --------------------------------------------------------

      - name: 타입 검사
        run: npm run typecheck

      # 여기가 이 워크플로의 존재 이유다.
      # 모델·스케줄러·악기·종단·wasm 테스트가 전부 여기서 돈다
      - name: 테스트 (음정 ±1센트 회귀 포함)
        run: npm run test:model

      - name: M0 스파이크 음정 테스트
        run: npm run test:pitch

      - name: 프로덕션 빌드
        run: npm run build

  # --- 서버 -----------------------------------------------------------------
  #
  # **이 잡이 없어서 사고가 났다.** server/README.md 는 "깨면 CI 가 잡는다"고
  # 적혀 있었지만 사실이 아니었고, 그 사이 스케줄러 정리 작업 6개가 통째로
  # 죽어 있는 상태로 테스트 105개가 통과하고 있었다.
  #
  # 프론트 잡과 **병렬로** 돈다. 서로 기다릴 이유가 없다.
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server

    # 테스트는 **진짜 Postgres·Redis** 를 쓴다. SQLite 로 대체하지 않는다 —
    # JSONB·부분 인덱스·자문 락·SKIP LOCKED 가 전부 다르게 동작해서,
    # 통과해도 아무것도 보장하지 못한다
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resona
          POSTGRES_PASSWORD: resona
          POSTGRES_DB: resona
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U resona"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20

    env:
      ENV: local
      KEY_PREFIX: 'ci:v1'
      DATABASE_URL: postgresql+asyncpg://resona:resona@localhost:55432/resona
      REDIS_CACHE_URL: redis://localhost:56379/8
      REDIS_CORE_URL: redis://localhost:56379/9
      JWT_SECRET: ci-secret-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - run: pip install -e ".[dev]"

      # --- 마이그레이션 ------------------------------------------------------

      # **헤드는 항상 하나여야 한다** (`SERVER_DATA.md` 1-3).
      # 브랜치 둘에서 각각 리비전을 만들면 머지 뒤 `upgrade head` 가 터지는데,
      # 그때는 이미 배포 중이다
      - name: Alembic 헤드가 하나인지
        run: |
          heads=$(alembic heads | grep -c . || true)
          test "$heads" -eq 1 || { echo "헤드가 $heads 개다"; alembic heads; exit 1; }

      - name: 마이그레이션 적용
        run: alembic upgrade head

      # 모델을 고치고 마이그레이션을 안 만들면 로컬에서는 통과하고 운영에서는
      # 컬럼이 없어서 500 이 난다. **빈 diff 여야 통과한다**
      - name: 모델 드리프트 검사
        run: |
          out=$(alembic check 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          echo "$out" | grep -q "No new upgrade operations detected"

      # --- 검사 -------------------------------------------------------------

      - name: 린트
        run: ruff check src tests

      - name: 테스트
        run: pytest -q --timeout=120

      # `cp .env.example .env` 가 실제로 뜨는지. 한때 여기서 부팅이 깨졌고,
      # 그 실패는 배포 현장에서야 드러났다
      - name: 예시 설정으로 부팅되는지
        run: |
          cp .env.example .env
          python -c "from resona.config import Settings; Settings(); print('부팅 설정 OK')"
          rm .env

      # 운영은 이 이미지로 프로세스 4종을 돌린다. 빌드가 깨지는 것을
      # 배포 시점에 알면 늦다
      - name: 도커 이미지 빌드
        run: docker build -t resona-server:ci .
