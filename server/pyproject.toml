[project]
name = "resona-server"
version = "0.1.0"
description = "저장·동기화·AI 서버. 오디오는 렌더링하지 않는다 (plan.md 5-2)"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    # RS256 검증에 cryptography 가 필요하다 — 구글 id_token 서명을 확인한다
    "pyjwt[crypto]>=2.9",
    # 구글 토큰 교환·JWKS 조회, 토스 결제 API. 서버가 밖으로 나가는 몇 안 되는 곳이다
    "httpx>=0.27",
    # 빌링키 암호화(AES-GCM). pyjwt[crypto] 로 딸려 오지만 **직접 쓰므로 명시한다** —
    # 전이 의존성에 기대면 그쪽이 빠지는 날 결제 수단이 저장 불가가 된다
    "cryptography>=42.0",
    "redis>=5.0",
    "email-validator>=2.2",
    "python-ulid>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    # 스트리밍(SSE) 테스트가 멈추면 CI 가 통째로 매달린다 — 반드시 상한을 건다
    "pytest-timeout>=2.3",
]

# **src 레이아웃이다** (`서버코드레퍼런스.md` 3절).
# 저장소 루트의 `/src` 는 프론트엔드라, 서버 패키지는 `server/src/resona/` 에 둔다
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 설치 없이도 `resona` 를 찾을 수 있게 한다
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "T20"]
ignore = ["S101"]  # assert 는 테스트에서 쓴다

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # 테스트용 더미 비밀번호
# 자동 생성 마이그레이션은 줄 길이를 강제하지 않는다
"src/resona/migrations/*" = ["E501"]
