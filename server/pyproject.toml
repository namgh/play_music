[project]
name = "resona-server"
version = "0.1.0"
description = "저장·동기화·AI 서버. 오디오는 렌더링하지 않는다 (plan.md 5-2)"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "redis>=5.0",
    "email-validator>=2.2",
    "python-ulid>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "T20"]
ignore = ["S101"]  # assert 는 테스트에서 쓴다

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # 테스트용 더미 비밀번호
"app/migrations/*" = ["E501"]
