<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>v5 11 이펙트</title>
<link rel="stylesheet" href="base.css"><script src="../redesign-v4/lib.js"></script><script src="shell.js"></script>
<style>
  .insp{left:56px;top:52px;width:264px;height:848px}
  .ch{display:flex;align-items:center;justify-content:flex-start;gap:9px;height:36px;border-radius:8px;padding:0 10px;font-size:13px;margin-top:4px;background:var(--sub)}
  .ch.on{background:var(--tx);color:#fff}
  .ch .h{color:var(--tx3);font-size:12px}
  .ch span{margin-left:auto;font-size:11px;color:var(--tx3)}
  .ch.on span{color:#A1A1AA}
  .cat{font-size:12.5px;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 4px}
  .cat span{font-size:11px;color:var(--tx3)}
  .ws{left:320px;top:52px;width:1120px;height:848px}
  .ax{position:absolute;font-size:10.5px;color:var(--dt3)}
  .nd{position:absolute;width:24px;height:24px;border-radius:50%;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .nd.on{background:var(--y);color:#0E0E10}
  .nd.off{background:var(--d0);border:2px solid var(--dt2);color:var(--dt)}
  .bandrow{position:absolute;left:16px;right:16px;display:flex;gap:6px}
  .bandrow .dfd{flex:1}
  .bandrow .dfd.on{outline:1.5px solid var(--y)}
  .mod{position:absolute;top:560px;width:362px;height:272px;border-radius:12px;background:var(--d1);padding:14px}
  .mod .t{font-size:13px;font-weight:600;color:var(--dt);display:flex;justify-content:space-between}
  .mod .t span{font-size:11px;font-weight:500;color:var(--dt3)}
  .mod .kr{display:flex;justify-content:space-between;position:absolute;left:10px;right:10px;bottom:14px}
</style></head>
<body>
<div class="pg" data-root id="root">
  <div class="a insp" id="insp">
    <div class="ttl"><i style="background:var(--c2)"></i>베이스 · 인서트</div><div class="st">위에서 아래로 통과 · 끌어서 순서 바꾸기</div>
    <div class="sec">체인</div>
    <div class="ch on"><span class="h">1</span>채널 EQ<span>8밴드</span></div>
    <div class="ch"><span class="h">2</span>컴프레서<span>−3.2 dB</span></div>
    <div class="ch"><span class="h">3</span>새추레이션<span>테이프</span></div>
    <div class="ch" style="background:none;border:1px dashed var(--line);color:var(--tx3)">＋ 이펙트 추가</div>
    <div class="sec">보내기</div>
    <div class="row"><span class="lb">버스 1</span><span class="tr"><i style="width:30%"></i><u style="left:calc(30% - 7px)"></u></span><b>−12 dB</b></div>
    <div class="row"><span class="lb">버스 2</span><span class="tr"><i style="width:18%"></i><u style="left:calc(18% - 7px)"></u></span><b>−20 dB</b></div>
    <div class="sec">이펙트 고르기<span>내장 + 웹 플러그인</span></div>
    <div id="cats"></div>
  </div>
  <div class="a ws" id="ws"></div>
</div>
<script>
  const root = $('#root');
  shell(root, { rail: 'mixer', phase: ['part', '일부 구현'] });
  [['다이내믹스', '컴프·멀티밴드·리미터·게이트·디에서'], ['EQ', '채널·리니어 페이즈·매치'], ['리버브', '알고리즘·컨볼루션'], ['딜레이', '테이프·스테레오·디자이너'], ['모듈레이션', '코러스·플랜저·페이저'],
   ['디스토션 · 앰프', '새추레이션·앰프·캐비닛'], ['필터', '오토 필터·스펙트럴 게이트'], ['피치', '피치 보정·시프터'], ['미터', '라우드니스·상관·튜너'], ['MIDI 이펙트', '아르페지에이터·코드·스크립터'], ['웹 플러그인 (WAM 2)', '설치한 것 3개']]
    .forEach(([n, d]) => el('div', 'cat', `${n}<span>${d.split('·')[0]}…</span>`, $('#cats')));
  const W = $('#ws');
  at(el('div', '', `<span class="dseg"><span class="on">채널 EQ</span><span>컴프레서</span><span>새추레이션</span></span>&nbsp;&nbsp;<span class="dchip">리니어 페이즈 끔</span> <span class="dchip">매치 EQ: 레퍼런스에 맞추기…</span> <span class="dchip">A/B · 소리 크기 맞춰 비교</span>`, W), 16, 12).style.position = 'absolute';
  const EW = 1088, EH = 420, L = 56, R = EW - 16, T = 56, B = EH + 20;
  const fx = f => L + (Math.log10(f) - Math.log10(20)) / 3 * (R - L), dy = db => T + (18 - db) / 36 * (B - T);
  let g = '';
  [20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000].forEach(f => { g += `<line x1="${fx(f)}" y1="${T}" x2="${fx(f)}" y2="${B}" stroke="#202025"/>`; at(el('div', 'ax', f >= 1000 ? f / 1000 + 'k' : String(f), W), fx(f) - 8, B + 8); });
  [-18, -12, -6, 0, 6, 12, 18].forEach(d => { g += `<line x1="${L}" y1="${dy(d)}" x2="${R}" y2="${dy(d)}" stroke="${d === 0 ? '#2C2C33' : '#202025'}"/>`; at(el('div', 'ax', (d > 0 ? '+' : '') + d, W), 18, dy(d) - 7); });
  let sp = `M ${L} ${B}`; for (let k = 0; k <= 220; k++) { const f = 20 * Math.pow(1000, k / 220);
    const lv = -30 + 26 * Math.exp(-Math.pow(Math.log10(f / 70), 2) / .09) + 8 * Math.exp(-Math.pow(Math.log10(f / 900), 2) / .2) - 10 * Math.max(0, Math.log10(f / 2000)) + Math.sin(k * 1.7) * 1.5;
    sp += ` L ${fx(f).toFixed(1)} ${dy(Math.max(-18, lv * .55)).toFixed(1)}`; } sp += ` L ${R} ${B} Z`;
  const BANDS = [[30, 0, 'HP', 'off'], [100, 3, '로우 셸프', 'off'], [250, -1.5, '피크', 'off'], [800, -4, '피크', 'on'], [2500, 1, '피크', 'off'], [8000, 1.5, '하이 셸프', 'off']];
  const resp = f => 3 / (1 + Math.pow(f / 100, 2)) - 1.5 * Math.exp(-Math.pow(Math.log2(f / 250), 2) / .5) - 4 * Math.exp(-Math.pow(Math.log2(f / 800), 2) / .9) + 1 * Math.exp(-Math.pow(Math.log2(f / 2500), 2) / .7) + 1.5 / (1 + Math.pow(8000 / f, 2)) - 18 / (1 + Math.pow(f / 30, 4));
  let cv = ''; for (let k = 0; k <= 260; k++) { const f = 20 * Math.pow(1000, k / 260); cv += (k ? ' L ' : 'M ') + fx(f).toFixed(1) + ' ' + Math.min(B, dy(resp(f))).toFixed(1); }
  at(el('div', '', `<svg width="${EW}" height="${B + 30}" fill="none">${g}<path d="${sp}" fill="rgba(242,169,126,.18)"/><path d="${cv}" stroke="#FFD60A" stroke-width="2.4"/></svg>`, W), 16, 0).style.position = 'absolute';
  BANDS.forEach(([f, d, t, st], i) => at(el('div', 'nd ' + st, String(i + 1), W), 16 + fx(f) - 12, Math.min(B, dy(resp(f))) - 12));
  const br = at(el('div', 'bandrow', null, W), 16, 478);
  BANDS.forEach(([f, d, t, st], i) => el('div', 'dfd' + (st === 'on' ? ' on' : ''), `<small>${i + 1} · ${t}</small><b>${f >= 1000 ? f / 1000 + 'k' : f}<em>Hz</em> ${d > 0 ? '+' : ''}${d}<em>dB</em></b>`, br));
  // 모듈 세 개
  const M = [['컴프레서', '−3.2 dB 압축 중', [[.45, '스레숄드', '−18 dB'], [.2, '레이시오', '3 : 1'], [.1, '어택', '8 ms'], [.3, '릴리즈', '180 ms']]],
    ['리미터 · 트루 피크', '출력 · 천장 −1.0 dBTP', [[.7, '입력 게인', '+2.0 dB'], [.9, '천장', '−1.0 dB'], [.3, '릴리즈', '50 ms'], [1, '룩어헤드', '켬']]],
    ['컨볼루션 리버브 · 버스 1', 'IR: 작은 홀 (합성)', [[.4, '길이', '1.6 s'], [.5, '프리딜레이', '20 ms'], [.6, '고역 감쇠', '4 kHz'], [.25, '섞기', '100 %']]]];
  M.forEach(([t, s, ks], i) => { const m = at(el('div', 'mod', `<div class="t">${t}<span>${s}</span></div>`, W), 16 + i * 370, 560);
    if (i === 0) { let d = ''; const io = x => x < -18 ? x : -18 + (x + 18) / 3; for (let x = -60; x <= 0; x++) d += (x === -60 ? 'M ' : ' L ') + (20 + (x + 60) / 60 * 130).toFixed(1) + ' ' + (150 - (io(x) + 60) / 60 * 110).toFixed(1);
      m.insertAdjacentHTML('beforeend', `<svg width="330" height="160" style="position:absolute;left:14px;top:30px" fill="none"><rect x="20" y="40" width="130" height="110" stroke="#2C2C33"/><path d="${d}" stroke="#FFD60A" stroke-width="2"/><rect x="190" y="40" width="10" height="110" rx="3" fill="#202025"/><rect x="190" y="40" width="10" height="24" rx="3" fill="#FFD60A"/><text x="210" y="62" fill="#9C9CA5" font-size="11" font-family="Inter">−3.2 dB</text></svg>`); }
    else if (i === 1) { m.insertAdjacentHTML('beforeend', `<svg width="330" height="160" style="position:absolute;left:14px;top:30px" fill="none">${Array.from({ length: 60 }, (_, k) => { const h = 20 + Math.abs(Math.sin(k * .37)) * 70; return `<rect x="${k * 5.5}" y="${130 - h}" width="3" height="${h}" fill="#82B4F0" opacity=".7"/>`; }).join('')}<line x1="0" y1="52" x2="330" y2="52" stroke="#E5484D" stroke-dasharray="4 4"/></svg>`); }
    else { let d = 'M 0 70'; for (let k = 0; k < 300; k++) { const a = Math.exp(-k / 70) * 55 * (k < 6 ? k / 6 : 1); d += ` L ${k * 1.1} ${(70 + Math.sin(k * 2.1) * a * (.5 + Math.random() * .5)).toFixed(1)}`; }
      m.insertAdjacentHTML('beforeend', `<svg width="330" height="160" style="position:absolute;left:14px;top:30px" fill="none"><path d="${d}" stroke="#B9A2EE" stroke-width="1"/></svg>`); }
    const kr = el('div', 'kr', null, m); ks.forEach(([v, l, val]) => kr.insertAdjacentHTML('beforeend', knob5(v, 40, l, val, true))); });
</script>
<script src="../redesign-v4/extract4.js"></script>
</body></html>
