<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>무드보드</title>
<style>
  :root{--bg:#EDEDEA;--ink:#161616;--ink-2:#6A6A66;--card:#fff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo",sans-serif}
  header{padding:40px 40px 20px;max-width:1500px}
  h1{margin:0;font-size:34px;letter-spacing:-.8px}
  header p{margin:10px 0 0;font-size:15px;color:var(--ink-2);line-height:1.6}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:22px;padding:10px 40px 60px}
  figure{margin:0;background:var(--card);border-radius:14px;overflow:hidden;cursor:pointer;position:relative;outline:3px solid transparent;transition:outline-color .15s}
  figure.on{outline-color:#E2231A}
  figure img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
  .no{position:absolute;left:12px;top:12px;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font:600 15px/34px "Helvetica Neue",sans-serif;text-align:center}
  figure.on .no{background:#E2231A}
  figcaption{padding:14px 16px 16px}
  figcaption b{font-size:17px}
  figcaption small{font-size:12px;color:var(--ink-2);margin-left:6px}
  figcaption p{margin:6px 0 0;font-size:13px;color:var(--ink-2);line-height:1.55}
  .pick{position:sticky;bottom:0;background:var(--ink);color:#fff;padding:14px 40px;font-size:15px;display:flex;gap:16px;align-items:center}
  .pick b{color:#FF8A80}
</style></head>
<body>
<header>
  <h1>무드보드 — 마음이 가는 걸 골라 주세요</h1>
  <p>실제 사이트를 그대로 찍은 화면입니다. 마음에 드는 카드를 누르면 빨갛게 표시되고, 아래에 번호가 모입니다.<br>"이유는 몰라도 끌린다"면 충분합니다. 2~3개면 좋고 더 많아도 됩니다.</p>
</header>
<div class="grid" id="g"></div>
<div class="pick">고른 번호: <b id="sel">아직 없음</b></div>
<script>
  // [file, crop position, name, kind, what it carries]
  const T = [
    ['te-ep133', '50% 40%', 'Teenage Engineering EP-133', '하드웨어', '포스터 같은 대담함. 기기를 영웅처럼 다룬다'],
    ['te-op1', '50% 70%', 'Teenage Engineering OP-1', '하드웨어', '조용한 회색, 정밀한 물건 하나만'],
    ['logic', '30% 60%', 'Logic Pro (iPad)', '제품 화면', '소리를 원형 빛의 무늬로 보여준다'],
    ['melodyne', '30% 18%', 'Melodyne', '음정 편집', '음 하나하나가 덩어리(블롭)로, 음정 곡선이 그 안에'],
    ['proq4', '50% 8%', 'FabFilter Pro-Q 4', '제품 화면', '빛나는 스펙트럼, 소리가 풍경처럼'],
    ['fabfilter', '50% 30%', 'FabFilter Pro-C 3', '제품 화면', '소리를 3D 지형으로'],
    ['bitwig', '50% 50%', 'Bitwig Studio', '제품 화면', '선명한 색 그라디언트 + 촘촘한 화면'],
    ['minimal', '50% 25%', 'Minimal Audio — Current', '신스', '어두운 영화 같은 분위기, 보라빛 오브제'],
    ['pigments', '50% 40%', 'Arturia Pigments', '신스', '흰 바탕 + 고정폭 글자, 차분한 연구실'],
    ['endlesss', '50% 30%', 'Endlesss', '협업 잼', '파스텔 그라디언트, 가볍고 즐거움'],
    ['dubler', '50% 25%', 'Vochlea Dubler', '목소리 → 악기', '어두운 카드 + 네온 포인트'],
    ['moog', '50% 45%', 'Moog', '하드웨어', '나무와 금속, 따뜻한 사진'],
    ['elektron', '50% 50%', 'Elektron Tonverk', '하드웨어', '케이블과 색, 손으로 만지는 기계'],
    ['soundtoys', '50% 50%', 'Soundtoys', '플러그인', '빈티지 장비를 그대로 옮긴 실물감'],
    ['synplant', '40% 40%', 'Sonic Charge Synplant', '신스', '소리를 씨앗·DNA처럼 키운다 — 유기적'],
    ['note', '50% 0%', 'Ableton Note', '앱', '사람과 순간을 담은 사진'],
    ['polyend', '50% 50%', 'Polyend', '하드웨어', '거대한 글자 + 기기 사진'],
    ['vital', '50% 3%', 'Vital', '신스', '보라색 하나로 밀어붙인 정체성'],
    ['opal', '50% 50%', 'Opal', '카메라 브랜드', '물건들을 위에서 찍은 편집 잡지 감성'],
    ['rauno', '50% 50%', 'Rauno Freiberg', '디자이너', '노랑 원 하나, 극단적인 절제'],
    ['mymind', '50% 35%', 'mymind', '앱', '세리프 + 부드러운 해 그라디언트, 고요함'],
    ['cosmos', '50% 50%', 'Cosmos', '앱', '흩어진 사물들이 떠 있는 공간'],
    ['strudel', '20% 20%', 'Strudel', '코드로 음악', '터미널 글자만으로 음악을'],
    ['live12', '50% 30%', 'Ableton Live 12', '제품', '작업실 사진 속의 화면'],
  ];
  const g = document.getElementById('g'), picked = new Set(), sel = document.getElementById('sel');
  T.forEach(([f, pos, name, kind, desc], i) => {
    const n = i + 1, el = document.createElement('figure');
    el.innerHTML = `<img src="img/${f}.jpg" style="object-position:${pos}" loading="lazy"><span class="no">${n}</span>
      <figcaption><b>${name}</b><small>${kind}</small><p>${desc}</p></figcaption>`;
    el.onclick = () => { picked.has(n) ? picked.delete(n) : picked.add(n); el.classList.toggle('on');
      sel.textContent = picked.size ? [...picked].sort((a, b) => a - b).join(', ') : '아직 없음'; };
    g.appendChild(el);
  });
</script>
</body></html>
