 font-family='Pretendard, Apple SD Gothic Neo, Helvetica, sans-serif'>바꿔</text><rect x='369' y='87' width='36' height='22' rx='5' fill='#46464C'/><text x='387.0' y='102.0' font-size='11' fill='#E8E8EA' font-weight='500' text-anchor='middle' font-family='Pretendard, Apple SD Gothic Neo, Helvetica, sans-serif'>캐치</text><rect x='409' y='87' width='36' height='22' rx='5' fill='#46464C'/><text x='427.0' y='102.0' font-size='11' fill='#E8E8EA' font-weight='500' text-anchor='middle' font-family='Pretendard, Apple SD Gothic Neo, Helvetica, sans-serif'>튜너</text><rect x='449' y='87' width='47' height='22' rx='5' fill='#46464C'/><text x='472.5' y='102.0' font-size='11' fill='#E8E8EA' font-weight='500' text-anchor='middle' font-family='Pretendard, Apple SD Gothic Neo, Helvetica, sans-serif'>바운스</text><rect x='500' y='87' width='69' height='22' rx='5' fill='#46464C'/><text x='534.5' y='102.0' font-size='11' fill='#E8E8EA' font-weight='500' text-anchor='middle' font-family='Pretendard, Apple SD Gothic Neo, Helvetica, sans-serif'>노멀라이즈</text><rect x='573' y='87' width='25' height='22' rx='5' fill='#46464C'/><text x='585.5' y='102.0' font-size='11' fill='#E8E8EA' font-weight='500' text-anchor='middle' font-family='Pretendard, Apple SD Gothic Neo, Helvetica, sans-serif'>…</text><text x='622' y='102' font-size='11' fill='#9A9AA2' font-weight='400' text-anchor='start' font-family='Pretendard, Apple SD Gothic Neo, Helvetica, sans-serif'>← 툴바 (기본은 꺼짐, &quot;툴바&quot; 단추로 켬)</text><circle cx='30' cy='180' r='11' fill='#F5C518'/><text x='30' y='184' font-size='12' fill='#1A1A1A' font-weight='700' text-anchor='middle' font-family='Pretendard, Apple SD Gothic Neo, Helvetica, sans-serif'>1</text><text x='52' y='185' font-size='15' fill='#E8E8EA' font-weight='700' text-anchor='start' font-family='Pretendard, Apple SD Gothic Neo, Helvetica, sans-serif'>보기 단추 6개</text><text x='52' y='210' font-size='13' fill='#9A9AA2' font-weight='400' text-anchor='start' font-family='Pretendard, Apple SD Gothic Neo, Helvetica, sans-serif'>라이브러리·인스펙터·툴바·스마트 컨트롤·믹서·편집기 — 패널을 켜고 끄기만 한다. 기능이 아니라 &quot;어디를 볼지&quot;</text><circle cx='30' cy='246' r='11' fill='#F5C518'/><text x='30' y='250' font-size='12' fill='#1A1A1A' font-weight='700' text-anchor='middle' font-family='Pretendard, Apple SD Gothic Neo, Helvetica, sans-serif'>2</text><text x='52' y='251' font-size='15' fill='#E8E8EA' font-weight='700' text-anchor='start' font-family='Pretendard, Apple SD Gothic Neo, Helvetica, sans-serif'>트랜스포트 6개</text><text x='52' y='276' font-size='13' fill='#9A9AA2' font-weight='400' text-anchor='start' font-family='Pretendard, Apple SD Gothic Neo, Helvetica, sans-serif'>되감기·빨리감기·정지·재생·녹음·사이클. 녹음 방식(펀치·테이크·바꿔)은 녹음 메뉴와 단추 우클릭 안</text><circle cx='30' cy='312' r='11' fill='#F5C518'/><text x='30' y='316' font-size='12' fill='#1A1A1A' font-weight='700' text-anchor='middle' font-family='Pretendard, Apple SD Gothic Neo, Helvetica, sans-serif'>3</text><text x='52' y='317' font-size='15' fill='#E8E8EA' font-weight='700' text-anchor='start' font-family='Pretendard, Apple SD Gothic Neo, Helvetica, sans-serif'>LCD 하나</text><text x='52' y='342' font-size='13' fill='#9A9AA2' font-weight='400' text-anchor='start' font-family='Pretendard, Apple SD Gothic Neo, Helvetica, sans-serif'>위치·템포·박자·조를 한 칸에. 숫자를 끌거나 두 번 눌러 고친다 — 별도 입력칸이 없다</text><circle cx='30' cy='378' r='11' fill='#F5C518'/><text x='30' y='382' font-size='12' fill='#1A1A1A' font-weight='700' text-anchor='middle' font-family='Pretendard, Apple SD Gothic Neo, Helvetica, sans-serif'>4</text><text x='52' y='383' font-size='15' fill='#E8E8EA' font-weight='700' text-anchor='start' font-family='Pretendard, Apple SD Gothic Neo, Helvetica, sans-serif'>모드 단추 4~5개</text><text x='52' y='408' font-size='13' fill='#9A9AA2' font-weight='400' text-anchor='start' font-family='Pretendard, Apple SD Gothic Neo, Helvetica, sans-serif'>튜너·바꿔·솔로·카운트인·메트로놈. 우클릭하면 그 설정이 나온다</text><circle cx='30' cy='444' r='11' fill='#F5C518'/><text x='30' y='448' font-size='12' fill='#1A1A1A' font-weight='700' text-anchor='middle' font-family='Pretendard, Apple SD Gothic Neo, Helvetica, sans-serif'>5</text><text x='52' y='449' font-size='15' fill='#E8E8EA' font-weight='700' text-anchor='start' font-family='Pretendard, Apple SD Gothic Neo, Helvetica, sans-serif'>창 단추 4개</text><text x='52' y='474' font-size='13' fill='#9A9AA2' font-weight='400' text-anchor='start' font-family='Pretendard, Apple SD Gothic Neo, Helvetica, sans-serif'>목록 편집기·메모장·루프·브라우저 — 오른쪽 패널 토글</text><circle cx='30' cy='510' r='11' fill='#F5C518'/><text x='30' y='514' font-size='12' fill='#1A1A1A' font-weight='700' text-anchor='middle' font-family='Pretendard, Apple SD Gothic Neo, Helvetica, sans-serif'>·</text><text x='52' y='515' font-size='15' fill='#E8E8EA' font-weight='700' text-anchor='start' font-family='Pretendard, Apple SD Gothic Neo, Helvetica, sans-serif'>사용자화</text><text x='52' y='540' font-size='13' fill='#9A9AA2' font-weight='400' text-anchor='start' font-family='Pretendard, Apple SD Gothic Neo, Helvetica, sans-serif'>컨트롤 막대 우클릭 → &quot;컨트롤 막대 및 표시 사용자화&quot; 로 단추를 넣고 뺀다. 기본값은 적게</text></svg>